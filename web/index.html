<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCL 產業新聞</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1c2430; --muted:#5f6b7a; --line:#e3e7ec;
  --accent:#0f6e6e; --accent-soft:#e3f1f0; --chip:#eef1f4; --warn:#a15c00;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12161b; --panel:#1a2027; --text:#e6eaef; --muted:#97a3b1; --line:#2a323c;
    --accent:#4fb8b0; --accent-soft:#1d3433; --chip:#242b34; --warn:#e0a24a; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 16px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:20px;margin-top:20px}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;align-self:start;position:sticky;top:12px}
@media (max-width:820px){aside{position:static}}
aside h3{font-size:13px;color:var(--muted);margin:14px 0 8px;font-weight:600}
aside h3:first-child{margin-top:0}
input[type=search],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.65;margin-left:4px;font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.tab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.group{margin-bottom:22px}
.group h2{font-size:16px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.group h2 .n{color:var(--muted);font-size:13px;font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.dt{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 8px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.card a.t{display:block;color:var(--text);text-decoration:none;font-weight:600;font-size:15px}
.card a.t:hover{color:var(--accent);text-decoration:underline}
.meta{color:var(--muted);font-size:12px;margin:2px 0 6px}
.sum{font-size:14px;margin:0 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;padding:1px 8px;border-radius:4px;background:var(--chip);color:var(--muted)}
.tag.c{background:var(--accent-soft);color:var(--accent)}
.pay{color:var(--warn);font-size:12px;margin-left:6px}
.empty{color:var(--muted);padding:30px;text-align:center}
.clear{margin-top:14px;font-size:13px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0}
footer{color:var(--muted);font-size:12px;padding:30px 0}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>CCL 產業新聞</h1>
  <div class="sub" id="sub">載入中…</div>
</div></header>

<div class="wrap layout">
  <aside>
    <h3>關鍵字搜尋</h3>
    <input type="search" id="q" placeholder="例：M9、玻纖布、擴產">
    <h3>期間</h3>
    <select id="range">
      <option value="7">最近 7 天</option>
      <option value="30">最近 30 天</option>
      <option value="90" selected>最近 90 天</option>
      <option value="365">最近一年</option>
      <option value="0">全部</option>
    </select>
    <h3>來源</h3>
    <div class="chips" id="fs"></div>
    <h3>公司</h3>
    <div class="chips" id="fc"></div>
    <h3>主題</h3>
    <div class="chips" id="ft"></div>
    <button class="clear" id="clear">清除篩選</button>
  </aside>

  <main>
    <div class="tabs" id="tabs">
      <button class="tab on" data-v="time">依時間</button>
      <button class="tab" data-v="company">依公司</button>
      <button class="tab" data-v="topic">依主題</button>
    </div>
    <div id="list"></div>
  </main>
</div>
<div class="wrap"><footer>資料來源：DIGITIMES、優分析 公開標題與摘要，全文請點連結至原網站閱讀。本頁僅供內部研究使用。</footer></div>

<script src="news.js" onerror="void 0"></script>
<script>
(function(){
  const S = {view:"time", q:"", range:90, comp:new Set(), topic:new Set(), src:new Set()};
  let D = window.NEWS_DATA;
  const $ = id => document.getElementById(id);
  const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  async function init(){
    // 線上版優先抓最新的 news.json（加時間參數避免瀏覽器快取舊資料）；本機直接開檔時用 news.js
    if(location.protocol.startsWith("http")){
      try{ const r = await fetch("news.json?t=" + Date.now(), {cache:"no-store"}); if(r.ok) D = await r.json(); }catch(e){}
    }
    if(!D){ $("sub").textContent = "資料載入失敗，請重新整理頁面。"; return; }
    $("sub").textContent = `來源：${(D.sources||[]).join("、")}　·　共 ${D.items.length} 則　·　最後更新 ${D.updated_at}`;
    buildChips(); bind(); render();
  }

  function inRange(n){
    if(!S.range) return true;
    if(!n.date) return true;
    return (Date.now() - new Date(n.date).getTime()) / 864e5 <= S.range;
  }
  function filtered(ignore){
    const q = S.q.trim().toLowerCase();
    return D.items.filter(n => inRange(n)
      && (ignore==="src" || !S.src.size || S.src.has(n.source))
      && (ignore==="comp" || !S.comp.size || n.companies.some(c => S.comp.has(c)))
      && (ignore==="topic" || !S.topic.size || n.topics.some(t => S.topic.has(t)))
      && (!q || (n.title + " " + n.summary).toLowerCase().includes(q)));
  }

  function buildChips(){
    const mk = (el, names, set, key, field) => {
      const pool = filtered(key);
      el.innerHTML = names.map(name => {
        const cnt = pool.filter(n => [].concat(n[field]).includes(name)).length;
        return `<button class="chip ${set.has(name)?"on":""}" data-k="${esc(name)}">${esc(name)}<span class="n">${cnt}</span></button>`;
      }).join("");
      el.querySelectorAll(".chip").forEach(b => b.onclick = () => {
        const k = b.dataset.k; set.has(k) ? set.delete(k) : set.add(k); render();
      });
    };
    mk($("fs"), D.sources || [], S.src, "src", "source");
    mk($("fc"), D.companies, S.comp, "comp", "companies");
    mk($("ft"), D.topics, S.topic, "topic", "topics");
  }

  function card(n){
    return `<div class="card">
      <div class="dt">${n.date ? esc(n.date.replace(/-/g, "/")) : "日期待抓取"}</div>
      <a class="t" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
      <div class="meta">${esc(n.source)}${n.author && n.author !== n.source ? "／" + esc(n.author) : ""}${n.paywall_hint ? '<span class="pay">摘要需訂閱，請看原文</span>' : ""}</div>
      ${n.summary ? `<p class="sum">${esc(n.summary)}</p>` : ""}
      <div class="tags">${n.companies.map(c=>`<span class="tag c">${esc(c)}</span>`).join("")}${n.topics.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>`;
  }

  function render(){
    buildChips();
    const items = filtered();
    const L = $("list");
    if(!items.length){ L.innerHTML = '<div class="empty">沒有符合條件的新聞</div>'; return; }
    if(S.view === "time"){
      const byMonth = {};
      items.forEach(n => { const k = (n.date||"未知").slice(0,7); (byMonth[k] = byMonth[k] || []).push(n); });
      L.innerHTML = Object.keys(byMonth).sort((a,b) => a==="未知" ? 1 : b==="未知" ? -1 : b.localeCompare(a)).map(k =>
        `<div class="group"><h2>${k==="未知"?"日期不明":k.replace("-"," 年 ")+" 月"}<span class="n">${byMonth[k].length} 則</span></h2>${byMonth[k].map(card).join("")}</div>`).join("");
    } else {
      const field = S.view === "company" ? "companies" : "topics";
      const names = (S.view === "company" ? D.companies : D.topics).concat(["其他"]);
      L.innerHTML = names.map(name => {
        const g = items.filter(n => name === "其他" ? !n[field].length : n[field].includes(name));
        return g.length ? `<div class="group"><h2>${esc(name)}<span class="n">${g.length} 則</span></h2>${g.map(card).join("")}</div>` : "";
      }).join("");
    }
  }

  function bind(){
    $("q").oninput = e => { S.q = e.target.value; render(); };
    $("range").onchange = e => { S.range = +e.target.value; render(); };
    $("clear").onclick = () => { S.src.clear(); S.comp.clear(); S.topic.clear(); S.q=""; $("q").value=""; render(); };
    $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => {
      $("tabs").querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
      b.classList.add("on"); S.view = b.dataset.v; render();
    });
  }
  init();
})();
</script>
</body>
</html>
