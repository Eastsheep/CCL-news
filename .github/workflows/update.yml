name: 更新 CCL 新聞

on:
  schedule:
    # GitHub 整點排程常延遲很久，所以避開整點
    - cron: "17 22 * * *"  # 每天台灣時間 06:17
    - cron: "17 10 * * *"  # 每天台灣時間 18:17
  workflow_dispatch:        # 也可以在 Actions 頁面手動執行
    inputs:
      sources:
        description: "只抓這些來源（逗號分隔，留空=全部），例如 財訊"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ccl-news
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: github.event_name != 'push'
        run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: 抓取新聞（推送程式更新時只重新部署，不重新爬取，減少對來源網站的負擔）
        if: github.event_name != 'push'
        run: python scraper.py
        env:
          ONLY_SOURCES: ${{ github.event.inputs.sources }}
      - name: 保存資料
        if: github.event_name != 'push'
        run: |
          git config user.name "ccl-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json web/news.js web/news.json
          git diff --cached --quiet || git commit -m "更新新聞資料 $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
