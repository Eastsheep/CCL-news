name: 更新 CCL 新聞

on:
  schedule:
    - cron: "0 23 * * *"   # 每天台灣時間早上 7:00
  workflow_dispatch:        # 也可以在 Actions 頁面手動執行
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ccl-news
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 抓取新聞
        run: python scraper.py
      - name: 保存資料
        run: |
          git config user.name "ccl-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json web/news.js web/news.json
          git diff --cached --quiet || git commit -m "更新新聞資料 $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
