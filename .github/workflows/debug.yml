name: debug-dt
on:
  push:
    branches: [debug-dt]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124.0 Safari/537.36 CCLNewsBot/0.1 (internal research)"
          echo "=== udn robots"; curl -sSL -A "$UA" https://money.udn.com/robots.txt | head -40
          echo "=== cna robots"; curl -sSL -A "$UA" https://www.cna.com.tw/robots.txt | head -40
          a(){ sleep 3; c=$(curl -sSL -A "$UA" "$1" -o x.html -w "%{http_code}"); echo "== $1 $c $(wc -c <x.html)"; grep -oE '<title>[^<]*|<meta[^>]+(og:title|og:description|og:image|published_time|pubdate|date)[^>]*>' x.html | cut -c1-200 | head -6; }
          a https://money.udn.com/money/story/5612/9825897
          a https://www.cna.com.tw/news/afe/202610200326.aspx
          l(){ sleep 3; c=$(curl -sSL -A "$UA" "$1" -o x.html -w "%{http_code}"); echo "== LIST $1 $c $(wc -c <x.html) links:$(grep -oE "$2" x.html | sort -u | wc -l)"; }
          l "https://money.udn.com/search/result/1001/CCL" 'money/story/[0-9]+/[0-9]+'
          l "https://money.udn.com/money/cate/5612" 'money/story/[0-9]+/[0-9]+'
          l "https://money.udn.com/rssfeed/news/1001/5612?ch=money" 'money/story/[0-9]+/[0-9]+'
          l "https://www.cna.com.tw/search/hysearchws.aspx?q=CCL" 'news/[a-z]+/[0-9]{12}\.aspx'
          l "https://www.cna.com.tw/list/afe.aspx" 'news/[a-z]+/[0-9]{12}\.aspx'
          l "https://feeds.feedburner.com/rsscna/finance" 'news/[a-z]+/[0-9]{12}\.aspx'
          echo "=== ctee rss"; l "https://www.ctee.com.tw/rss_web/livenews/ctee" 'news/20[0-9]{11}-[0-9]{6}'; l "https://www.ctee.com.tw/rss" 'news/20'
