name: debug-dt
on:
  push:
    branches: [debug-dt]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124.0 Safari/537.36 CCLNewsBot/0.1 (internal research)"
          B=https://ieknet.iek.org.tw
          echo "=== robots"; curl -sSL -A "$UA" $B/robots.txt | head -40
          echo "=== article"; curl -sSL -A "$UA" "$B/ieknews/news_open.aspx?nsl_id=b38c89781d264b54868671d3180e2fb6" -o a.html; wc -c a.html
          grep -oE '<title>[^<]*|<meta[^>]+(og:|description|date)[^>]*>' a.html | head
          grep -oE '20[0-9]{2}[/.-][0-9]{1,2}[/.-][0-9]{1,2}' a.html | sort | uniq -c | head -5
          sed -e 's/<[^>]*>/ /g' a.html | tr -s ' \n' | grep -v '^\s*$' | grep -n -iE '登入|會員|台光電|M9' | head -20
          echo "=== list pages"
          for u in "$B/ieknews/news_list.aspx" "$B/ieknews/news_list.aspx?actiontype=ieknews&indu_idno=1" "$B/ieknews/news_list.aspx?actiontype=ieknews&indu_idno=16" "$B/ieknews/" ; do
            curl -sSL -A "$UA" "$u" -o l.html; echo "$u $(wc -c < l.html) bytes, links: $(grep -oE 'news_(open|more)\.aspx\?[^"]*nsl_id=[0-9a-f]{32}' l.html | sort -u | wc -l)"
            grep -oE 'news_(open|more)\.aspx\?[^"]*nsl_id=[0-9a-f]{32}"[^>]*>[^<]{4,}' l.html | head -3
            sleep 3
          done
          echo "=== search"; curl -sSL -A "$UA" "$B/ieknews/news_list.aspx?keyword=CCL" -o s.html; grep -oE 'nsl_id=[0-9a-f]{32}' s.html | sort -u | wc -l
          grep -oE 'href="[^"]*(list|search|query)[^"]*"' a.html | sort -u | head -20
