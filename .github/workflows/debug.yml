name: debug-dt
on:
  push:
    branches: [debug-dt]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124.0 Safari/537.36 CCLNewsBot/0.1 (internal research)"
          echo "=== sitemap"; curl -sSL -A "$UA" https://www.wealth.com.tw/sitemap.xml | head -c 1500; echo
          echo "=== article"; curl -sSL -A "$UA" https://www.wealth.com.tw/articles/8c734bf6-0b00-4e2b-a574-6c9c7084b43b -o a.html; wc -c a.html
          grep -oE '<title>[^<]*|<meta[^>]+(og:|description|published)[^>]*>' a.html | head -20
          grep -oE '__NEXT_DATA__|__NUXT__|application/ld\+json' a.html | sort | uniq -c
          python3 -c "
import re;h=open('a.html',encoding='utf-8',errors='ignore').read()
m=re.search(r'<script[^>]*application/ld\+json[^>]*>(.*?)</script>',h,re.S)
print('LD', m.group(1)[:800] if m else None)
m=re.search(r'__NEXT_DATA__[^>]*>(.*?)</script>',h,re.S)
print('NEXT', m.group(1)[:1500] if m else None)"
