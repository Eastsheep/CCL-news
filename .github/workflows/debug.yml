name: debug-dt
on:
  push:
    branches: [debug-dt]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124.0 Safari/537.36 CCLNewsBot/0.1 (internal research)"
          B=https://ieknet.iek.org.tw
          curl -sSI -A "$UA" $B/robots.txt | head -3
          curl -sSL -A "$UA" $B/ieknews/ -o h.html
          grep -oE 'href="[^"#]*"' h.html | grep -viE 'nsl_id|\.(css|js|png|jpg|ico)' | sort -u | head -60
          for u in "$B/ieknews/news_more.aspx?actiontype=ieknews&indu_idno=1" "$B/ieknews/news_more.aspx?actiontype=ieknews&indu_idno=16" "$B/ieknews/news_more.aspx?actiontype=ieknews&indu_idno=7"; do
            sleep 3; curl -sSL -A "$UA" "$u" -o l.html; echo "== $u $(wc -c < l.html) links: $(grep -oE 'nsl_id=[0-9a-f]{32}' l.html | sort -u | wc -l)"
            grep -oE 'nsl_id=[0-9a-f]{32}" title="[^"]+' l.html | head -4; grep -oE '20[0-9]{2}/[0-9]{1,2}/[0-9]{1,2}' l.html | head -3
          done
