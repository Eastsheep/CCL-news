name: debug-dt
on:
  push:
    branches: [debug-dt]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124.0 Safari/537.36 CCLNewsBot/0.1 (internal research)"
          B=https://ieknet.iek.org.tw/ieknews
          curl -sSL -A "$UA" "$B/news_open.aspx?nsl_id=4268569d682443fcbe58d192adb8a2ca" -o x.html
          grep -oE '<title>[^<]*' x.html | head -1; grep -oE '20[0-9]{2}/[0-9]{1,2}/[0-9]{1,2}' x.html | head -2
          grep -oE '<meta name="description" content="[^"]{0,300}' x.html
          for n in 0 1 2 3 4 5 6 7 10 11 12 13 14 16; do sleep 2; curl -sSL -A "$UA" "$B/default.aspx?actiontype=ieknews&indu_idno=$n" -o l.html; echo "indu $n: $(grep -c 4268569d682443fcbe58d192adb8a2ca l.html) $(grep -oE '<title>[^<]*' l.html | head -1)"; done
