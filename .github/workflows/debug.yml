name: debug-dt
on:
  push:
    branches: [debug-dt]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124.0 Safari/537.36 CCLNewsBot/0.1 (internal research)"
          for f in livenews/ctee livenews/all livenews/industry livenews/tech livenews/stock news/industry industry/tech livenews/60042; do sleep 3; c=$(curl -sSL -A "$UA" "https://www.ctee.com.tw/rss_web/$f" -o r.xml -w "%{http_code}"); echo "RSS $f $c items:$(grep -c '<item>' r.xml) oldest:$(grep -oE '<pubDate>[^<]+' r.xml | tail -1)"; done
