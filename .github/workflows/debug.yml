name: debug-dt
on:
  push:
    branches: [debug-dt]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124.0 Safari/537.36 CCLNewsBot/0.1 (internal research)"
          B=https://ieknet.iek.org.tw
          for q in "news_open.aspx?nsl_id=c8b3e728db394c5eafc260b4ab920ef3" "news_open.aspx?actiontype=ieknews&indu_idno=1&nsl_id=c8b3e728db394c5eafc260b4ab920ef3" "news_more.aspx?actiontype=ieknews&indu_idno=1&nsl_id=c8b3e728db394c5eafc260b4ab920ef3" "news_open.aspx?nsl_id=986482cb4ddc498b92a0470f1ac42e86"; do
            sleep 3; curl -sSL -A "$UA" "$B/ieknews/$q" -o x.html; echo "== $q $(wc -c < x.html)"; grep -oE '<title>[^<]*' x.html | head -2; grep -oE "var _title = '[^']*'" x.html
          done
