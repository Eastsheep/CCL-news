name: debug-dt
on:
  push:
    branches: [debug-dt]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124.0 Safari/537.36 CCLNewsBot/0.1 (internal research)"
          B=https://ieknet.iek.org.tw/ieknews
          curl -sSL -A "$UA" "$B/default.aspx?actiontype=ieknews&indu_idno=1" -o l.html
          grep -n -iE 'PageIndex|<form|submit\(\)|function [a-zA-Z]*[Pp]age' l.html | cut -c1-250 | head -20
